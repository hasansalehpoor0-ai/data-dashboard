name: Porsline Data Sync

on:
  schedule:
    - cron: '*/5 * * * *' # اجرای هر 5 دقیقه
  workflow_dispatch: # امکان اجرای دستی

jobs:
  sync_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run sync script
        env:
          PORSLINE_API_KEY: ${{ secrets.PORSLINE_API_KEY }}
        run: python porsline_sync.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data from Porsline" && git push)
